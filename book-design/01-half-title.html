<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Half-Title — Analyzing Islam Vol. I</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 24px 80px;
    min-height: 100vh;
  }

  /* B5 page: 176mm × 250mm at 96dpi = 665px × 945px */
  .page {
    width: 665px;
    height: 945px;
    background: #000000;
    color: #f5f5f5;
    position: relative;
    box-shadow: 0 0 0 1px #2a2a2a, 0 20px 60px rgba(0,0,0,0.8);
    flex-shrink: 0;
  }

  /* Margins: 20mm top/bottom, 18mm inner, 14mm outer */
  .page-inner {
    position: absolute;
    top: 76px;    /* 20mm */
    bottom: 76px;
    left: 68px;   /* 18mm — spine/inner margin */
    right: 53px;  /* 14mm — outer margin */
  }

  /* Half-title sits in the upper third of the live area */
  .half-title-block {
    margin-top: 180px;
  }

  .book-title {
    font-family: "Didot", "GFS Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 42px;
    font-weight: bold;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: #f5f5f5;
  }

  .volume-label {
    margin-top: 18px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #9a9a9a;
  }

  /* Thin rule under volume label */
  .rule {
    margin-top: 14px;
    width: 40px;
    height: 1px;
    background: #3a3a3a;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="page-inner">
      <div class="half-title-block">
        <div class="book-title">Analyzing Islam</div>
        <div class="volume-label">Volume I</div>
        <div class="rule"></div>
      </div>
    </div>
  </div>
</body>
</html>
