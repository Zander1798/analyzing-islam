<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Title Page — Analyzing Islam Vol. I</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 24px 80px;
    min-height: 100vh;
  }

  /* B5 page: 176mm × 250mm at 96dpi = 665px × 945px */
  .page {
    width: 665px;
    height: 945px;
    background: #000000;
    color: #f5f5f5;
    position: relative;
    box-shadow: 0 0 0 1px #2a2a2a, 0 20px 60px rgba(0,0,0,0.8);
    flex-shrink: 0;
  }

  .page-inner {
    position: absolute;
    top: 76px;
    bottom: 76px;
    left: 68px;
    right: 53px;
  }

  /* Upper block — title area, sits in top half */
  .title-block {
    margin-top: 140px;
  }

  .main-title {
    font-family: "Didot", "GFS Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 52px;
    font-weight: bold;
    line-height: 1.0;
    letter-spacing: -0.015em;
    color: #f5f5f5;
  }

  .divider {
    margin-top: 20px;
    width: 100%;
    height: 1px;
    background: #1e1e1e;
  }

  .volume-line {
    margin-top: 18px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #9a9a9a;
  }

  .source-subtitle {
    margin-top: 24px;
    font-family: "Didot", "GFS Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 15px;
    font-style: italic;
    font-weight: normal;
    color: #9a9a9a;
    line-height: 1.6;
    letter-spacing: 0.01em;
  }

  /* Lower block — publisher/year, pinned to bottom of live area */
  .colophon {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
  }

  .colophon-rule {
    width: 100%;
    height: 1px;
    background: #1e1e1e;
    margin-bottom: 16px;
  }

  .colophon-site {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #5a5a5a;
  }

  .colophon-year {
    margin-top: 6px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #5a5a5a;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="page-inner">

      <div class="title-block">
        <div class="main-title">Analyzing Islam</div>
        <div class="divider"></div>
        <div class="volume-line">Volume I</div>
        <div class="source-subtitle">
          The Quran<br>
          Sahih al-Bukhari<br>
          Sahih Muslim
        </div>
      </div>

      <div class="colophon">
        <div class="colophon-rule"></div>
        <div class="colophon-site">analyzingislam.com</div>
        <div class="colophon-year">2026</div>
      </div>

    </div>
  </div>
</body>
</html>
