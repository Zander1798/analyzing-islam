name: agent-docs

# Runs on every pull request, with no `paths:` filter, deliberately.
#
# A PR that only adds source files to a directory can push it over the mirror
# threshold and newly require a sibling AGENTS.md that does not exist yet. That
# is the case least likely to be caught by eye — and test files count toward the
# threshold, so a pure test-adding PR can trigger it.
#
# A pre-commit hook is not a substitute: it is per-clone, so fresh worktrees,
# automated agents and other contributors silently lack it.

# `push` matters as much as `pull_request` here: this repository is worked by
# direct pushes to main, so a pull_request-only trigger never fires at all. It
# had zero runs between being added and this change. On a push the check cannot
# block anything — the commit has already landed — but it turns a silently
# drifting mirror into a red X and a notification, which is the difference
# between a gate and a decoration.
#
# Blocking needs a ruleset requiring a PR and this check. Deliberately deferred
# until after Stage 12 rather than adding merge friction mid-migration.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/mirror-agents-md.mjs --check
